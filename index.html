<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BEMO-SOLUTIONS Operations OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="brand/bemo-mark.svg">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta name="theme-color" content="#0B1220">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..700,0..100,0..1&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: persistent collapsible sidebar + slim top bar + scrolling work canvas. Dense, calm, ink-and-paper with a turquoise signal colour. */
:root{
  --font: "Geist", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --bg:#F4F6F7; --bg-2:#ECEFF1; --surface:#FFFFFF; --surface-2:#F7F9FA; --surface-3:#EEF2F4;
  --line:#E1E6EA; --line-2:#CFD7DD;
  --fg:#0D161D; --fg-2:#43505C; --fg-3:#74818C; --fg-4:#A2ADB6;
  --accent:#0A929F; --accent-2:#087C88; --accent-fg:#FFFFFF; --accent-soft:#E2F4F5; --accent-line:#A5DCE1;
  --blue:#3464D3; --blue-soft:#E7EDFB;
  --green:#2B875D; --green-soft:#E3F2EA;
  --amber:#AF730B; --amber-soft:#FBF0DC;
  --red:#C93B34; --red-soft:#FBE8E7;
  --slate:#5E6B77; --slate-soft:#EDF0F2;
  --c1:#0A929F; --c2:#3464D3; --c3:#2B875D; --c4:#CF9223; --c5:#8A97A3; --c6:#B5627A;
  --ink:#0D161D;
  --shadow-1:0 1px 2px rgba(13,22,29,.05);
  --shadow-2:0 1px 2px rgba(13,22,29,.04),0 8px 24px rgba(13,22,29,.07);
  --shadow-3:0 24px 64px rgba(13,22,29,.22),0 2px 6px rgba(13,22,29,.08);
  --scrim:rgba(13,22,29,.38);
  --r:8px; --r-sm:6px; --r-lg:12px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#090D10; --bg-2:#0C1115; --surface:#10161B; --surface-2:#141B21; --surface-3:#1A232A;
  --line:#1F2830; --line-2:#2B3640;
  --fg:#E6ECEF; --fg-2:#A1AEB8; --fg-3:#72808B; --fg-4:#4C5963;
  --accent:#2EC3CF; --accent-2:#5AD4DE; --accent-fg:#051417; --accent-soft:rgba(46,195,207,.12); --accent-line:rgba(46,195,207,.38);
  --blue:#7299EE; --blue-soft:rgba(114,153,238,.14);
  --green:#4FB986; --green-soft:rgba(79,185,134,.14);
  --amber:#E2A744; --amber-soft:rgba(226,167,68,.14);
  --red:#EE6A61; --red-soft:rgba(238,106,97,.14);
  --slate:#93A1AC; --slate-soft:rgba(255,255,255,.06);
  --c1:#2EC3CF; --c2:#7299EE; --c3:#4FB986; --c4:#E2A744; --c5:#7E8C97; --c6:#D9849C;
  --ink:#E6ECEF;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --shadow-3:0 24px 70px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#090D10; --bg-2:#0C1115; --surface:#10161B; --surface-2:#141B21; --surface-3:#1A232A;
  --line:#1F2830; --line-2:#2B3640;
  --fg:#E6ECEF; --fg-2:#A1AEB8; --fg-3:#72808B; --fg-4:#4C5963;
  --accent:#2EC3CF; --accent-2:#5AD4DE; --accent-fg:#051417; --accent-soft:rgba(46,195,207,.12); --accent-line:rgba(46,195,207,.38);
  --blue:#7299EE; --blue-soft:rgba(114,153,238,.14);
  --green:#4FB986; --green-soft:rgba(79,185,134,.14);
  --amber:#E2A744; --amber-soft:rgba(226,167,68,.14);
  --red:#EE6A61; --red-soft:rgba(238,106,97,.14);
  --slate:#93A1AC; --slate-soft:rgba(255,255,255,.06);
  --c1:#2EC3CF; --c2:#7299EE; --c3:#4FB986; --c4:#E2A744; --c5:#7E8C97; --c6:#D9849C;
  --ink:#E6ECEF;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --shadow-3:0 24px 70px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11";overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.ic{flex:none;display:inline-block;vertical-align:middle}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-3)}
.sub{color:var(--fg-2)}
.small{font-size:12px}
.xs{font-size:11px}
.strong{font-weight:600}
.right{text-align:right}
.nowrap{white-space:nowrap}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.gap-4{gap:4px}.gap-12{gap:12px}.gap-16{gap:16px}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- App shell ---------- */
.app{display:flex;height:100%;min-height:0}
.sb{width:236px;flex:none;background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:width .22s var(--ease);min-height:0;padding-left:env(safe-area-inset-left,0px)}
.app.collapsed .sb{width:60px}
.sb-ws{display:flex;align-items:center;gap:10px;padding:12px 12px 10px;border-bottom:1px solid var(--line);cursor:pointer;min-height:56px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--ink);display:grid;place-items:center;flex:none}
.logo svg{display:block}
.sb-ws-t{min-width:0;flex:1}
.sb-ws-t b{display:block;font-size:13px;font-weight:600;white-space:nowrap}
.sb-ws-t span{display:block;font-size:11px;color:var(--fg-3);white-space:nowrap}
.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 8px 12px}
.sb-g{margin-top:12px}
.sb-g:first-child{margin-top:4px}
.sb-gl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-4);font-weight:600;padding:4px 10px 6px;white-space:nowrap}
.sb-l{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:6px;color:var(--fg-2);font-weight:500;white-space:nowrap;position:relative;transition:background .12s,color .12s}
.sb-l:hover{background:var(--surface-3);color:var(--fg)}
.sb-l.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-1)}
.sb-l.on .ic{color:var(--accent)}
.sb-l .ct{margin-left:auto;font-size:11px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.sb-l .ct.hot{color:var(--accent-fg);background:var(--accent);border-radius:9px;padding:0 6px;font-weight:600}
.app.collapsed .sb-gl,.app.collapsed .sb-l span,.app.collapsed .sb-l .ct,.app.collapsed .sb-ws-t,.app.collapsed .sb-foot-t{display:none}
.app.collapsed .sb-l{justify-content:center;padding:8px}
.app.collapsed .sb-ws{justify-content:center;padding:12px 8px}
.sb-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:10px}
.sb-foot-t{min-width:0;flex:1}
.sb-foot-t b{display:block;font-weight:600;font-size:12.5px;white-space:nowrap}
.sb-foot-t span{display:block;font-size:11px;color:var(--fg-3)}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.top{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;color:var(--fg-3)}
.crumbs a:hover{color:var(--fg)}
.crumbs b{color:var(--fg);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs .sep{color:var(--fg-4)}
.search-btn{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 10px;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;color:var(--fg-3);min-width:240px;cursor:pointer;transition:border-color .12s}
.search-btn:hover{border-color:var(--line-2)}
.kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--fg-3);background:var(--surface)}
.demo-pill{font-size:11px;color:var(--amber);background:var(--amber-soft);border-radius:20px;padding:3px 9px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:5px}
.main{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;scroll-behavior:auto}
.page{padding-block:20px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1560px;margin:0 auto}
.page.full{max-width:none}
.enter .page{animation:pageIn .26s var(--ease)}
@keyframes pageIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.mobile-only{display:none}
.app.setup .sb,.app.setup .top{display:none}

/* ---------- Page header ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:20px;line-height:1.25}
.ph-sub{color:var(--fg-3);margin-top:3px;font-size:13px}
.ph-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3);font-weight:600}

/* ---------- Buttons & controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-weight:500;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,transform .08s,box-shadow .12s;box-shadow:var(--shadow-1)}
.btn:hover{background:var(--surface-2);border-color:var(--fg-4)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.pri:hover{opacity:.9}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.acc:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--fg-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--fg)}
.btn.danger{color:var(--red)}
.btn.danger:hover{background:var(--red-soft);border-color:var(--red)}
.btn.sm{height:26px;padding:0 9px;font-size:12px;border-radius:6px}
.btn.xs{height:22px;padding:0 7px;font-size:11.5px;border-radius:5px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ib{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--fg-2);cursor:pointer;position:relative;transition:background .12s,color .12s;flex:none}
.ib:hover{background:var(--surface-3);color:var(--fg)}
.ib.sm{width:26px;height:26px;border-radius:6px}
.dot-badge{position:absolute;top:4px;right:4px;min-width:15px;height:15px;border-radius:8px;background:var(--red);color:#fff;font-size:9.5px;font-weight:600;display:grid;place-items:center;padding:0 3px;border:2px solid var(--surface)}
.inp,.sel,.ta{height:32px;border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:0 10px;outline:none;transition:border-color .12s,box-shadow .12s;min-width:0}
.sel{padding-right:26px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--fg-3) 50%),linear-gradient(135deg,var(--fg-3) 50%,transparent 50%);background-position:calc(100% - 13px) 13px,calc(100% - 9px) 13px;background-size:4px 4px;background-repeat:no-repeat;cursor:pointer}
.sel.sm,.inp.sm{height:26px;font-size:12px;border-radius:6px;padding-left:8px}
.sel.sm{background-position:calc(100% - 12px) 10px,calc(100% - 8px) 10px}
.ta{height:auto;min-height:72px;padding:8px 10px;resize:vertical;line-height:1.5;width:100%}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp-wrap{position:relative;display:flex;align-items:center}
.inp-wrap .ic{position:absolute;left:9px;color:var(--fg-3);pointer-events:none}
.inp-wrap .inp{padding-left:30px;width:100%}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:12px;font-weight:500;color:var(--fg-2)}
.field .inp,.field .sel{width:100%}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form-grid .span2{grid-column:1/-1}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.chk input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.switch{position:relative;width:32px;height:18px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line-2);border-radius:10px;transition:background .15s;cursor:pointer}
.switch span::after{content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;background:var(--surface);border-radius:50%;transition:transform .18s var(--ease);box-shadow:var(--shadow-1)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(14px)}

/* ---------- Segmented / tabs ---------- */
.seg{display:inline-flex;background:var(--surface-3);border-radius:8px;padding:2px;gap:2px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;height:26px;padding:0 10px;border-radius:6px;cursor:pointer;color:var(--fg-2);font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12.5px}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-1)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:9px 11px;color:var(--fg-3);font-weight:500;cursor:pointer;position:relative;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg)}
.tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.tab .ct{font-size:11px;color:var(--fg-3);background:var(--surface-3);border-radius:9px;padding:0 6px;font-variant-numeric:tabular-nums}
.tabpane{animation:fadeIn .18s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:46px}
.card-h h3{font-size:13.5px;font-weight:600}
.card-h .hint{font-size:12px;color:var(--fg-3)}
.card-b{padding:14px 16px}
.card-b.flush{padding:0}
.card.plain{border:0;background:transparent}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.g-32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.stack{display:flex;flex-direction:column;gap:14px}
.section-t{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-3);font-weight:600;margin:22px 0 10px}

/* KPI strip: one bordered band divided into cells, not a wall of cards */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.kpi{padding:13px 16px 12px;background:var(--surface);min-width:0;position:relative;cursor:default;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
[data-density="compact"] .tbl td{padding-top:5px;padding-bottom:5px}
[data-density="compact"] .card-b{padding:10px 14px}
[data-density="compact"] .kcard{padding:8px 9px}
[data-density="compact"] .li{padding-top:7px;padding-bottom:7px}
.kpi[data-go]{cursor:pointer}
.kpi[data-go]:hover{background:var(--surface-2)}
.kpi-l{font-size:11.5px;color:var(--fg-3);font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-v{font-size:21px;font-weight:600;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi-d{font-size:11.5px;margin-top:2px;color:var(--fg-3);display:flex;align-items:center;gap:4px;white-space:nowrap}
.kpi .spk{position:absolute;right:12px;bottom:12px;opacity:.9}
.up{color:var(--green)}.down{color:var(--red)}.warn{color:var(--amber)}

/* ---------- Badges, chips, avatars ---------- */
.b{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--slate-soft);color:var(--slate);line-height:1}
.b::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9;flex:none}
.b.nodot::before{display:none}
.b.cyan{background:var(--accent-soft);color:var(--accent-2)}
.b.blue{background:var(--blue-soft);color:var(--blue)}
.b.green{background:var(--green-soft);color:var(--green)}
.b.amber{background:var(--amber-soft);color:var(--amber)}
.b.red{background:var(--red-soft);color:var(--red)}
.b.gray{background:var(--slate-soft);color:var(--fg-3)}
.b.outline{background:transparent;border:1px solid var(--line-2);color:var(--fg-2)}
.b.outline::before{display:none}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;font-size:11.5px;border:1px solid var(--line);color:var(--fg-2);background:var(--surface-2);white-space:nowrap}
.prio{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--fg-2);white-space:nowrap}
.prio i{display:inline-flex;gap:1.5px;align-items:flex-end;height:11px}
.prio i b{width:3px;background:var(--line-2);border-radius:1px}
.prio i b:nth-child(1){height:5px}.prio i b:nth-child(2){height:8px}.prio i b:nth-child(3){height:11px}
.prio.p-urgent i b{background:var(--red)}
.prio.p-high i b:nth-child(-n+3){background:var(--amber)}
.prio.p-medium i b:nth-child(-n+2){background:var(--fg-2)}
.prio.p-low i b:nth-child(1){background:var(--fg-3)}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:600;color:#fff;flex:none;letter-spacing:.02em;position:relative}
.av.lg{width:40px;height:40px;font-size:14px}
.av.xl{width:52px;height:52px;font-size:17px}
.av.sm{width:20px;height:20px;font-size:8.5px}
.av .st{position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;border:2px solid var(--surface)}
.avs{display:inline-flex}
.avs .av{box-shadow:0 0 0 2px var(--surface)}
.avs .av+.av{margin-left:-6px}
.who{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;min-width:0}
.co-ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-weight:600;font-size:11px;flex:none;border:1px solid var(--line);background:var(--surface-2);color:var(--fg-2)}
.co-ic.lg{width:44px;height:44px;font-size:15px;border-radius:10px}
.src{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;flex:none}
.src.email{background:var(--blue-soft);color:var(--blue)}
.src.whatsapp{background:var(--green-soft);color:var(--green)}
.src.web{background:var(--accent-soft);color:var(--accent-2)}
.src.referral{background:var(--amber-soft);color:var(--amber)}
.src.manual{background:var(--slate-soft);color:var(--slate)}
.ai-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--accent-2);background:var(--accent-soft);border:1px dashed var(--accent-line);padding:1px 7px;border-radius:5px;white-space:nowrap}
.ver-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--green);background:var(--green-soft);padding:1px 7px;border-radius:5px;white-space:nowrap}
.sim-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--amber);background:var(--amber-soft);padding:1px 7px;border-radius:5px;white-space:nowrap}

/* ---------- Progress ---------- */
.pg{height:6px;background:var(--surface-3);border-radius:4px;overflow:hidden;min-width:48px;flex:1}
.pg>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .5s var(--ease)}
.pg.green>i{background:var(--green)}.pg.amber>i{background:var(--amber)}.pg.red>i{background:var(--red)}.pg.blue>i{background:var(--blue)}
.pg-row{display:flex;align-items:center;gap:8px;min-width:110px}
.pg-row .num{font-size:11.5px;color:var(--fg-2);width:32px;text-align:right}

/* ---------- Tables ---------- */
.tw{overflow-x:auto;min-width:0}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.75px}
.tbl th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:500;font-size:11.5px;color:var(--fg-3);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none;z-index:1}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{color:var(--fg)}
.tbl th .si{opacity:.0;margin-left:2px}
.tbl th.sorted .si{opacity:1;color:var(--accent)}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl td.wrap{white-space:normal;min-width:220px}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr[data-go],.tbl tbody tr[data-a]{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .r{text-align:right}
.tbl tfoot td{font-weight:600;background:var(--surface-2);border-top:1px solid var(--line)}
.cell-t{font-weight:500;color:var(--fg)}
.cell-s{font-size:11.5px;color:var(--fg-3)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .inp-wrap{width:240px}
.toolbar .spacer{flex:1}
.fchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);cursor:pointer;color:var(--fg-2);font-weight:500;font-size:12.5px;white-space:nowrap}
.fchip:hover{border-color:var(--line-2);color:var(--fg)}
.fchip.on{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent-2)}
.fchip .ct{font-size:11px;color:var(--fg-3)}
.fchip.on .ct{color:var(--accent-2)}

/* ---------- Kanban ---------- */
.kb{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;min-height:200px}
.kc{width:272px;flex:none;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;max-height:calc(100vh - 230px);transition:background .12s,border-color .12s}
.kc.over{background:var(--accent-soft);border-color:var(--accent-line)}
.kc-h{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:600;font-size:12.5px}
.kc-h .ct{color:var(--fg-3);font-weight:500;font-variant-numeric:tabular-nums}
.kc-h .sum{margin-left:auto;font-size:11.5px;color:var(--fg-3);font-weight:500}
.kc-b{padding:0 8px 8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:60px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;cursor:grab;box-shadow:var(--shadow-1);transition:box-shadow .15s,transform .15s,border-color .15s,opacity .15s}
.kcard:hover{border-color:var(--line-2);box-shadow:var(--shadow-2)}
.kcard.dragging{opacity:.4;transform:rotate(1.5deg)}
.kcard.dropped{animation:drop .35s var(--ease)}
@keyframes drop{0%{transform:scale(1.03);box-shadow:var(--shadow-2)}100%{transform:none}}
.kcard-t{font-weight:500;line-height:1.35;margin:3px 0 6px}
.kcard-m{display:flex;align-items:center;gap:6px;justify-content:space-between;font-size:11.5px;color:var(--fg-3)}
.kc-empty{border:1px dashed var(--line-2);border-radius:8px;padding:14px;text-align:center;color:var(--fg-4);font-size:12px}

/* ---------- Lists / feed / timeline ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li[data-go],.li[data-a]{cursor:pointer;transition:background .1s}
.li[data-go]:hover,.li[data-a]:hover{background:var(--surface-2)}
.li .grow .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .grow .s{font-size:12px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attn{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .12s,background .12s,transform .12s;min-width:0}
.attn:hover{border-color:var(--line-2);background:var(--surface-2)}
.attn .n{font-size:20px;font-weight:600;width:30px;text-align:center;font-variant-numeric:tabular-nums}
.attn .bar{width:3px;align-self:stretch;border-radius:2px}
.attn .t{font-weight:500;line-height:1.3}
.attn .s{font-size:12px;color:var(--fg-3)}
.tl{position:relative;padding-left:4px}
.tl-i{display:flex;gap:12px;padding:0 0 16px;position:relative}
.tl-i::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:1px;background:var(--line)}
.tl-i:last-child::before{display:none}
.tl-ic{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-3);color:var(--fg-2);border:1px solid var(--line)}
.tl-b{min-width:0;flex:1;padding-top:3px}
.tl-b .t{font-weight:500}
.tl-b .s{font-size:12px;color:var(--fg-3)}
.tl-b .body{margin-top:6px;padding:9px 11px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;color:var(--fg-2);font-size:12.5px;line-height:1.5}
.feed-i{display:flex;gap:10px;padding:9px 16px;align-items:flex-start;border-bottom:1px solid var(--line)}
.feed-i:last-child{border-bottom:0}
.feed-i .txt{font-size:12.5px;line-height:1.45;color:var(--fg-2);min-width:0}
.feed-i .txt b{color:var(--fg);font-weight:500}
.feed-i .when{font-size:11px;color:var(--fg-4);margin-top:1px}

/* ---------- Key/value ---------- */
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:9px 12px;font-size:12.75px}
.kv dt{color:var(--fg-3)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kv2 .k{font-size:11.5px;color:var(--fg-3);margin-bottom:3px}
.kv2 .v{font-weight:500}
.bul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.bul li{display:flex;gap:8px;align-items:flex-start;line-height:1.45;font-size:12.75px;color:var(--fg-2)}
.bul li .ic{margin-top:2px}

/* ---------- Detail header ---------- */
.dh{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.dh-l{display:flex;gap:14px;align-items:center;min-width:0}
.dh h1{font-size:20px}
.dh .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--fg-3);font-size:12.5px;margin-top:4px}
.stepper{display:flex;gap:0;overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.step{flex:1;min-width:110px;padding:10px 12px;border-right:1px solid var(--line);position:relative;cursor:default}
.step:last-child{border-right:0}
.step .n{font-size:11px;color:var(--fg-4);font-weight:600;font-family:var(--mono)}
.step .t{font-weight:600;font-size:12.5px;margin-top:2px}
.step .s{font-size:11px;color:var(--fg-3)}
.step.done .n{color:var(--green)}
.step.cur{background:var(--accent-soft)}
.step.cur .n{color:var(--accent-2)}
.step.cur::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
.step[data-a]{cursor:pointer}
.step[data-a]:hover{background:var(--surface-2)}
.step.cur[data-a]:hover{background:var(--accent-soft)}

/* ---------- Overlay layer: modal & drawer ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;animation:scrimIn .18s ease}
@keyframes scrimIn{from{opacity:0}}
.modal{position:fixed;z-index:51;left:50%;top:8vh;transform:translateX(-50%);width:min(560px,calc(100vw - 32px));max-height:84vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-3);animation:modalIn .22s var(--ease)}
.modal.lg{width:min(820px,calc(100vw - 32px))}
.modal.xl{width:min(1040px,calc(100vw - 32px))}
.modal.sm{width:min(420px,calc(100vw - 32px))}
@keyframes modalIn{from{opacity:0;transform:translate(-50%,8px) scale(.98)}to{opacity:1;transform:translate(-50%,0)}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);gap:12px}
.modal-h h2{font-size:15px}
.modal-b{padding:16px 18px;overflow-y:auto;min-height:0}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 14px 14px;align-items:center}
.drawer{position:fixed;z-index:51;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-3);display:flex;flex-direction:column;animation:drawerIn .26s var(--ease);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.wide{width:min(720px,100vw)}
@keyframes drawerIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.drawer .modal-b{flex:1}
.pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-3);animation:popIn .16s var(--ease);overflow:hidden}
@keyframes popIn{from{opacity:0;transform:translateY(-4px) scale(.985)}to{opacity:1;transform:none}}
.menu{padding:4px;min-width:200px}
.menu button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;padding:7px 9px;border-radius:6px;cursor:pointer;text-align:left;color:var(--fg)}
.menu button:hover{background:var(--surface-3)}
.menu .sep{height:1px;background:var(--line);margin:4px 0}
.menu .mh{font-size:11px;color:var(--fg-3);padding:6px 9px 2px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}

/* Command palette */
.cmdk{top:12vh;width:min(620px,calc(100vw - 32px))}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cmdk-in input{flex:1;border:0;outline:0;background:transparent;font-size:15px}
.cmdk-r{max-height:52vh;overflow-y:auto;padding:6px}
.cmdk-g{font-size:11px;color:var(--fg-3);font-weight:600;padding:8px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
.cmdk-i{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer}
.cmdk-i.on{background:var(--accent-soft)}
.cmdk-i .t{font-weight:500}
.cmdk-i .s{font-size:12px;color:var(--fg-3);margin-left:auto;white-space:nowrap}

/* Toasts & tooltip */
#toasts{position:fixed;z-index:80;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow-3);font-weight:500;max-width:380px;animation:toastIn .28s var(--ease)}
.toast.out{animation:toastOut .2s ease forwards}
.toast .ic{color:var(--accent)}
.toast.err .ic{color:var(--red)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}
#tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--bg);font-size:11.5px;padding:6px 9px;border-radius:7px;box-shadow:var(--shadow-2);opacity:0;transition:opacity .1s;max-width:260px;line-height:1.45;white-space:pre-line}
#tip.on{opacity:1}

/* ---------- Charts ---------- */
.chart{width:100%;display:block;overflow:visible}
.chart text{fill:var(--fg-3);font-size:10.5px;font-family:var(--font)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .axis-l{stroke:var(--line-2)}
.chart .hov{fill:transparent;cursor:crosshair}
.chart .hov:hover{fill:var(--fg);fill-opacity:.035}
.chart .bar{transition:opacity .12s}
.chart .bar:hover{opacity:.8}
.chart [data-a]{cursor:pointer}
.enter .chart .bar,.anim .chart .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .6s var(--ease) both}
.enter .chart .ln,.anim .chart .ln{stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 1s var(--ease) forwards}
.enter .chart .area,.anim .chart .area{animation:fadeIn .8s ease both}
.enter .hb-f,.anim .hb-f{animation:growX .6s var(--ease) both;transform-origin:left}
.enter .donut-s,.anim .donut-s{animation:fadeIn .5s ease both}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.hb{display:flex;flex-direction:column;gap:9px}
.hb-r{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px}
.hb-r[data-a],.hb-r[data-go]{cursor:pointer}
.hb-r[data-a]:hover .hb-l,.hb-r[data-go]:hover .hb-l{color:var(--fg)}
.hb-l{color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-t{height:9px;background:var(--surface-3);border-radius:3px;position:relative;overflow:visible}
.hb-f{height:100%;border-radius:3px;display:block}
.hb-m{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:var(--fg-3)}
.hb-v{font-variant-numeric:tabular-nums;color:var(--fg-2);font-size:12px;text-align:right;min-width:52px}
.donut-wrap{display:flex;align-items:center;gap:18px}
.donut-wrap svg{width:140px;height:140px;flex:none}
.donut-wrap .legend{flex-direction:column;gap:7px;flex:1;min-width:0}
.donut-wrap .legend span{justify-content:space-between;width:100%}
.donut-wrap .legend b{font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.funnel{display:flex;flex-direction:column;gap:6px}
.fn-r{display:grid;grid-template-columns:130px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:12.5px}
.fn-b{height:24px;border-radius:5px;background:var(--accent);display:flex;align-items:center;padding:0 8px;color:var(--accent-fg);font-weight:600;font-size:12px;font-variant-numeric:tabular-nums;min-width:28px}
.fn-c{font-size:11.5px;color:var(--fg-3);text-align:right}

/* ---------- Inbox / messaging ---------- */
.ibx{display:grid;grid-template-columns:200px minmax(280px,360px) minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);height:calc(100vh - 168px);min-height:520px;overflow:hidden}
.ibx-f{border-right:1px solid var(--line);padding:10px 8px;overflow-y:auto;background:var(--surface-2)}
.ibx-f .fl{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:6px;cursor:pointer;color:var(--fg-2);font-weight:500}
.ibx-f .fl:hover{background:var(--surface-3);color:var(--fg)}
.ibx-f .fl.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-1)}
.ibx-f .fl .ct{margin-left:auto;font-size:11px;color:var(--fg-3)}
.ibx-l{border-right:1px solid var(--line);overflow-y:auto;min-width:0}
.ibx-m{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;transition:background .1s}
.ibx-m:hover{background:var(--surface-2)}
.ibx-m.on{background:var(--accent-soft)}
.ibx-m.unread .nm{font-weight:600}
.ibx-m.unread::before{content:"";position:absolute;left:5px;top:18px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.ibx-m .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibx-m .pv{font-size:12px;color:var(--fg-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px;line-height:1.4}
.ibx-m .tm{font-size:11px;color:var(--fg-4);white-space:nowrap}
.ibx-d{overflow-y:auto;min-width:0}
.msg{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--surface);line-height:1.6;color:var(--fg-2);white-space:pre-line}
.bubble-wrap{display:flex;flex-direction:column;gap:10px}
.bubble{max-width:78%;padding:9px 12px;border-radius:12px;line-height:1.5;font-size:12.75px;background:var(--surface-3);border:1px solid var(--line);white-space:pre-line}
.bubble.me{align-self:flex-end;background:var(--accent-soft);border-color:var(--accent-line)}
.bubble .bm{font-size:10.5px;color:var(--fg-3);margin-top:4px}
.pipeline{display:flex;flex-direction:column;gap:2px}
.pl-s{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;font-size:12.5px;color:var(--fg-3);transition:background .2s,color .2s}
.pl-s .pi{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;transition:all .2s}
.pl-s.run{color:var(--fg);background:var(--accent-soft)}
.pl-s.run .pi{border-color:var(--accent);border-top-color:transparent;animation:spin .7s linear infinite}
.pl-s.ok{color:var(--fg-2)}
.pl-s.ok .pi{background:var(--green);border-color:var(--green);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}

/* AI panel */
.ai-box{border:1px solid var(--accent-line);background:linear-gradient(180deg,var(--accent-soft),transparent 120px),var(--surface);border-radius:var(--r-lg)}
.ai-box .card-h{border-bottom-color:var(--accent-line)}
.chat{display:flex;flex-direction:column;gap:16px;padding:18px}
.chat-m{display:flex;gap:10px;align-items:flex-start;max-width:100%}
.chat-m.user{flex-direction:row-reverse}
.chat-m.user .chat-b{background:var(--ink);color:var(--bg);border-color:var(--ink);max-width:70%}
.chat-b{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;line-height:1.55;min-width:0;max-width:100%}
.chat-b h4{font-size:12.5px;margin:10px 0 6px}
.chat-b h4:first-child{margin-top:0}
.chat-b ul{margin:4px 0;padding-left:18px}
.chat-b li{margin:2px 0}
.ai-sec{border-left:2px solid var(--accent);padding:2px 0 2px 12px;margin:10px 0}
.ver-sec{border-left:2px solid var(--green);padding:2px 0 2px 12px;margin:10px 0}
.draft{font-family:var(--font);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;white-space:pre-line;font-size:12.5px}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchip{border:1px solid var(--line);background:var(--surface);border-radius:16px;height:28px;padding:0 11px;cursor:pointer;color:var(--fg-2);font-size:12.25px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:all .12s}
.qchip:hover{border-color:var(--accent-line);color:var(--accent-2);background:var(--accent-soft)}

/* Recording */
.rec{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.rec-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 0 0 0 var(--red-soft);transition:transform .1s}
.rec-btn:active{transform:scale(.95)}
.rec-btn.on{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,59,52,.35)}70%{box-shadow:0 0 0 12px rgba(201,59,52,0)}100%{box-shadow:0 0 0 0 rgba(201,59,52,0)}}
.rec-t{font-family:var(--mono);font-size:20px;font-weight:500;width:72px;font-variant-numeric:tabular-nums}
.wave{flex:1;height:40px;display:flex;align-items:center;gap:2px;overflow:hidden;min-width:0}
.wave i{flex:1;min-width:2px;max-width:4px;background:var(--fg-4);border-radius:2px;height:4px;transition:height .12s ease}
.wave.on i{background:var(--accent)}
.transcript{display:flex;flex-direction:column;gap:10px;max-height:300px;overflow-y:auto;padding-right:4px}
.tr-l{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;font-size:12.75px;line-height:1.5;animation:fadeIn .3s ease}
.tr-l .ts{font-family:var(--mono);font-size:11px;color:var(--fg-4);padding-top:2px}
.tr-l b{font-weight:600;color:var(--fg)}
.qa{border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;background:var(--surface)}
.qa.done{border-color:var(--green-soft);background:linear-gradient(90deg,var(--green-soft),transparent 40%),var(--surface)}
.qa .q{display:flex;gap:9px;align-items:flex-start;font-weight:500}
.qa .inp{width:100%}

/* Architecture */
.arch{width:100%;height:440px;display:block;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px;border-radius:0 0 12px 12px;touch-action:none}
.arch .node{cursor:grab}
.arch .node:active{cursor:grabbing}
.arch .node rect{fill:var(--surface);stroke:var(--line-2);stroke-width:1}
.arch .node:hover rect{stroke:var(--accent)}
.arch .node text{fill:var(--fg);font-size:12px;font-weight:500;font-family:var(--font)}
.arch .node .nt{fill:var(--fg-3);font-size:10px;font-weight:400}
.arch .edge{fill:none;stroke:var(--fg-4);stroke-width:1.5}
.arch .edge.flow{stroke:var(--accent);stroke-dasharray:5 5;animation:flow 1.2s linear infinite}
.arch .el{fill:var(--fg-3);font-size:10px;font-family:var(--font)}
@keyframes flow{to{stroke-dashoffset:-20}}

/* Gantt / calendar */
.gantt{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow-x:auto}
.gt{min-width:980px;position:relative}
.gt-h,.gt-r{display:grid;grid-template-columns:260px 1fr;border-bottom:1px solid var(--line)}
.gt-r:last-child{border-bottom:0}
.gt-h{background:var(--surface-2);font-size:11px;color:var(--fg-3);position:sticky;top:0;z-index:2}
.gt-n{padding:9px 14px;border-right:1px solid var(--line);min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);position:sticky;left:0;z-index:1}
.gt-h .gt-n{background:var(--surface-2)}
.gt-tr{position:relative;height:42px}
.gt-h .gt-tr{height:32px}
.gt-m{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11px;padding:8px 6px;color:var(--fg-3);white-space:nowrap}
.gt-bar{position:absolute;top:11px;height:20px;border-radius:5px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:500;color:#fff;overflow:hidden;white-space:nowrap;cursor:pointer;box-shadow:var(--shadow-1)}
.gt-bar .pf{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.22)}
.gt-bar span{position:relative}
.gt-today{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--red);z-index:1;pointer-events:none}
.gt-today::before{content:"Today";position:absolute;top:2px;left:3px;font-size:10px;color:var(--red);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.cal-h{padding:8px 10px;font-size:11px;color:var(--fg-3);font-weight:600;background:var(--surface-2);border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.06em}
.cal-d{min-height:108px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-d:nth-child(7n){border-right:0}
.cal-d .dn{font-size:11.5px;color:var(--fg-3);font-variant-numeric:tabular-nums;margin-bottom:2px}
.cal-d.out{background:var(--surface-2)}
.cal-d.out .dn{color:var(--fg-4)}
.cal-d.today .dn{color:var(--accent-fg);background:var(--accent);border-radius:10px;padding:0 6px;align-self:flex-start;font-weight:600}
.cal-e{font-size:11px;padding:2px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-weight:500}
.cal-e.cyan{background:var(--accent-soft);color:var(--accent-2)}.cal-e.red{background:var(--red-soft);color:var(--red)}.cal-e.blue{background:var(--blue-soft);color:var(--blue)}.cal-e.green{background:var(--green-soft);color:var(--green)}.cal-e.amber{background:var(--amber-soft);color:var(--amber)}

/* Quote / invoice document */
.doc{background:#fff;color:#141c22;border-radius:6px;padding:40px 44px;box-shadow:var(--shadow-2);border:1px solid var(--line);font-size:12.5px;line-height:1.5;max-width:780px;margin:0 auto}
.doc h2{font-size:22px;letter-spacing:-.02em;color:#0d161d}
.doc .dmuted{color:#6b7782}
.doc table{width:100%;border-collapse:collapse;margin-top:14px}
.doc th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#6b7782;border-bottom:1.5px solid #0d161d;padding:7px 6px}
.doc td{padding:9px 6px;border-bottom:1px solid #e3e8ec;vertical-align:top}
.doc .tot{margin-left:auto;width:260px;margin-top:12px}
.doc .tot div{display:flex;justify-content:space-between;padding:4px 6px}
.doc .tot .gt{border-top:1.5px solid #0d161d;font-weight:700;font-size:14px;margin-top:4px;padding-top:8px}
.doc .dlogo{display:flex;align-items:center;gap:10px}
.doc .dlogo .logo{background:#0d161d}
.doc .stamp{display:inline-block;border:1.5px solid #0a929f;color:#0a929f;font-weight:700;letter-spacing:.1em;font-size:11px;padding:3px 8px;border-radius:4px;text-transform:uppercase}
.li-ed{display:grid;grid-template-columns:minmax(0,1fr) 70px 110px 110px 32px;gap:8px;align-items:center}
.li-ed.h{font-size:11.5px;color:var(--fg-3);font-weight:500}

/* Integration cards */
.int{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.int-h{display:flex;align-items:center;gap:10px}
.int-ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--surface-3);color:var(--fg);flex:none;border:1px solid var(--line)}
.int .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px}
.int .stats .k{color:var(--fg-3);font-size:11px}

/* Team */
.member{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.member:hover{border-color:var(--line-2);box-shadow:var(--shadow-2)}
.member .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:left}
.member .stats b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.member .stats span{font-size:11px;color:var(--fg-3)}

/* Docs preview */
.fpv{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:24px;min-height:360px}
.fpv .paper{background:#fff;color:#141c22;max-width:560px;margin:0 auto;padding:32px 36px;border-radius:4px;box-shadow:var(--shadow-2);font-size:12px;line-height:1.6}
.fpv .paper h3{font-size:16px;margin-bottom:4px;color:#0d161d}
.fpv .paper .ln{height:8px;background:#e8ecef;border-radius:3px;margin:7px 0}

/* Empty */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:36px 20px;color:var(--fg-3)}
.empty .ei{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface-3);color:var(--fg-3);margin-bottom:4px}
.empty b{color:var(--fg);font-weight:600;font-size:13.5px}
.empty p{max-width:340px;font-size:12.5px}
.skel{background:linear-gradient(90deg,var(--surface-3),var(--surface-2),var(--surface-3));background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:5px;height:10px}
@keyframes shimmer{to{background-position:-200% 0}}
.callout{display:flex;gap:10px;padding:10px 12px;border-radius:9px;font-size:12.5px;line-height:1.5;border:1px solid var(--line);background:var(--surface-2);color:var(--fg-2)}
.callout.amber{background:var(--amber-soft);border-color:transparent;color:var(--fg)}
.callout.amber .ic{color:var(--amber)}
.callout.cyan{background:var(--accent-soft);border-color:var(--accent-line);color:var(--fg)}
.callout.cyan .ic{color:var(--accent-2)}
.callout.red{background:var(--red-soft);border-color:transparent;color:var(--fg)}
.callout.red .ic{color:var(--red)}
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
.sublist{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.sublist .li.on{background:var(--accent-soft)}
.subnav{display:flex;flex-direction:column;gap:2px}
.subnav button{display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--fg-2);font-weight:500;text-align:left}
.subnav button:hover{background:var(--surface-3);color:var(--fg)}
.subnav button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-1)}
.perm{text-align:center}
.perm .ic{color:var(--green)}
.perm .no{color:var(--fg-4)}
.gauge text{font-family:var(--font)}

/* ---------- Responsive ---------- */
@media (max-width:1280px){
  .kpis{grid-template-columns:repeat(5,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g5{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:1100px){
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-21,.g-12,.g-32{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ibx{grid-template-columns:minmax(240px,320px) minmax(0,1fr)}
  .ibx-f{display:none}
  .split{grid-template-columns:minmax(0,1fr)!important}
  .split>.sublist{max-height:260px;overflow-y:auto}
  .kv2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .search-btn{min-width:0}
  .search-btn .lbl{display:none}
}
@media (max-width:860px){
  .sb{position:fixed;z-index:70;left:0;top:0;bottom:0;transform:translateX(-102%);transition:transform .24s var(--ease);width:260px!important;box-shadow:var(--shadow-3);padding-top:env(safe-area-inset-top,0px)}
  .app.mnav .sb{transform:none}
  .app.collapsed .sb-gl,.app.collapsed .sb-l span,.app.collapsed .sb-l .ct,.app.collapsed .sb-ws-t,.app.collapsed .sb-foot-t{display:revert}
  .app.collapsed .sb-l{justify-content:flex-start;padding:6px 10px}
  .mobile-only{display:inline-grid}
  .desk-only{display:none!important}
  .page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top{padding-left:max(8px,env(safe-area-inset-left,0px))}
  .g2,.g3,.g4,.g5{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ibx{grid-template-columns:minmax(0,1fr);height:auto}
  .ibx-l{max-height:340px;border-right:0;border-bottom:1px solid var(--line)}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:110px minmax(0,1fr)}
  .doc{padding:22px 18px}
  .donut-wrap{flex-direction:column;align-items:stretch}
  .donut-wrap svg{align-self:center}
  .fn-r{grid-template-columns:96px minmax(0,1fr) 70px}
  .toolbar .inp-wrap{width:100%}
  .li-ed{grid-template-columns:minmax(0,1fr) 54px 90px 32px}
  .li-ed .lt{display:none}
  .crumbs .cr-mid{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* =====================================================================
   THEME REFRESH: soft lavender canvas, floating sidebar, rounded cards,
   indigo accent, hero KPI card, pill badges. Overrides the base styles above.
   ===================================================================== */
:root{
  --font: "Plus Jakarta Sans", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --bg:#EEF0F8; --bg-2:#E6E9F4; --surface:#FFFFFF; --surface-2:#F6F7FC; --surface-3:#EEF0F8;
  --line:#E9EBF4; --line-2:#D8DCEA;
  --fg:#141A2E; --fg-2:#4A5270; --fg-3:#7C849E; --fg-4:#AEB4C8;
  --accent:#4F5DF5; --accent-2:#3C49D9; --accent-fg:#FFFFFF; --accent-soft:#ECEEFF; --accent-line:#C3C8FF;
  --blue:#2F7BEA; --blue-soft:#E6F0FD;
  --green:#14A06A; --green-soft:#DFF6EC;
  --amber:#D98E0B; --amber-soft:#FDF2DD;
  --red:#E5484D; --red-soft:#FDE9EA;
  --slate:#5E6784; --slate-soft:#EFF1F7;
  --c1:#4F5DF5; --c2:#F0508C; --c3:#1FB57A; --c4:#F5A524; --c5:#C3C8DA; --c6:#9B5CF6;
  --ink:#141A2E;
  --hero-a:#6070FF; --hero-b:#3B47D6; --dark-card:#141A2E;
  --card-border:transparent;
  --shadow-1:0 1px 2px rgba(20,26,46,.04),0 4px 14px rgba(20,26,46,.045);
  --shadow-2:0 2px 4px rgba(20,26,46,.04),0 12px 32px rgba(20,26,46,.09);
  --shadow-3:0 24px 64px rgba(20,26,46,.20),0 2px 8px rgba(20,26,46,.08);
  --scrim:rgba(20,26,46,.40);
  --r:10px; --r-sm:8px; --r-lg:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A0D18; --bg-2:#0E1221; --surface:#131929; --surface-2:#182036; --surface-3:#1E2742;
  --line:#222B45; --line-2:#2F3A5A;
  --fg:#E8EBF5; --fg-2:#A9B0C7; --fg-3:#7B839D; --fg-4:#4D5571;
  --accent:#6E7BFF; --accent-2:#9AA3FF; --accent-fg:#FFFFFF; --accent-soft:rgba(32,199,217,.15); --accent-line:rgba(32,199,217,.42);
  --blue:#6EA6FF; --blue-soft:rgba(110,166,255,.14);
  --green:#3ED598; --green-soft:rgba(62,213,152,.14);
  --amber:#F5B83D; --amber-soft:rgba(245,184,61,.14);
  --red:#FF6B70; --red-soft:rgba(255,107,112,.15);
  --slate:#9AA3BD; --slate-soft:rgba(255,255,255,.06);
  --c1:#6E7BFF; --c2:#F472A8; --c3:#34D399; --c4:#FBBF24; --c5:#36405E; --c6:#B48CFF;
  --ink:#E8EBF5; --hero-a:#6E7BFF; --hero-b:#3E48C8; --dark-card:#1E2742;
  --card-border:#1D2540;
  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 2px 4px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.4);
  --shadow-3:0 24px 70px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0A0D18; --bg-2:#0E1221; --surface:#131929; --surface-2:#182036; --surface-3:#1E2742;
  --line:#222B45; --line-2:#2F3A5A;
  --fg:#E8EBF5; --fg-2:#A9B0C7; --fg-3:#7B839D; --fg-4:#4D5571;
  --accent:#6E7BFF; --accent-2:#9AA3FF; --accent-fg:#FFFFFF; --accent-soft:rgba(32,199,217,.15); --accent-line:rgba(32,199,217,.42);
  --blue:#6EA6FF; --blue-soft:rgba(110,166,255,.14);
  --green:#3ED598; --green-soft:rgba(62,213,152,.14);
  --amber:#F5B83D; --amber-soft:rgba(245,184,61,.14);
  --red:#FF6B70; --red-soft:rgba(255,107,112,.15);
  --slate:#9AA3BD; --slate-soft:rgba(255,255,255,.06);
  --c1:#6E7BFF; --c2:#F472A8; --c3:#34D399; --c4:#FBBF24; --c5:#36405E; --c6:#B48CFF;
  --ink:#E8EBF5; --hero-a:#6E7BFF; --hero-b:#3E48C8; --dark-card:#1E2742;
  --card-border:#1D2540;
  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 2px 4px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.4);
  --shadow-3:0 24px 70px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4);
}
body{font-size:13.5px;letter-spacing:-.003em}
h1,h2,h3,h4{font-weight:700;letter-spacing:-.02em}

/* Shell: floating sidebar on a soft canvas */
.app{padding:14px 0 14px 14px;gap:0}
.sb{width:248px;background:var(--surface);border:1px solid var(--card-border);border-radius:22px;box-shadow:var(--shadow-1);overflow:hidden}
.app.collapsed .sb{width:68px}
.sb-ws{border-bottom:0;padding:18px 16px 8px;min-height:64px}
.logo{background:var(--accent-soft);border-radius:10px;width:34px;height:34px}
.sb-ws-t b{font-size:15px;font-weight:700;letter-spacing:-.02em}
.sb-nav{padding:6px 12px 12px}
.sb-g{margin-top:16px}
.sb-gl{font-size:10.5px;letter-spacing:.09em;color:var(--fg-4);padding:4px 12px 8px}
.sb-l{padding:9px 12px;border-radius:12px;gap:12px;margin-bottom:2px;color:var(--fg-2)}
.sb-l:hover{background:var(--surface-2);color:var(--fg)}
.sb-l.on{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;box-shadow:0 8px 18px -6px rgba(21,146,196,.55)}
.sb-l.on .ic{color:#fff}
.sb-l .ct{background:var(--surface-3);border-radius:99px;padding:1px 7px;font-weight:600}
.sb-l.on .ct,.sb-l.on .ct.hot{background:rgba(255,255,255,.22);color:#fff}
.sb-l .ct.hot{border-radius:99px;padding:1px 7px}
.app.collapsed .sb-l{padding:10px}
.sb-foot{margin:10px 12px 12px;border:0;border-radius:18px;background:var(--dark-card);color:#fff;padding:12px;position:relative;overflow:hidden}
.sb-foot::after{content:"";position:absolute;right:-26px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(32,199,217,.45),transparent 70%);pointer-events:none}
.sb-foot-t b{color:#fff}
.sb-foot-t span{color:rgba(255,255,255,.6)}
.sb-foot .ib{color:rgba(255,255,255,.75);position:relative;z-index:1}
.sb-foot .ib:hover{background:rgba(255,255,255,.12);color:#fff}
.app.collapsed .sb-foot{margin:8px;padding:10px 6px;justify-content:center}
.top{height:64px;background:transparent;border-bottom:0;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.crumbs{font-size:13.5px}
.crumbs b{font-weight:600}
.search-btn{height:40px;border-radius:12px;background:var(--surface);border-color:var(--card-border);box-shadow:var(--shadow-1);min-width:280px}
.top .ib{width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-1)}
.top .ib:hover{background:var(--surface-2)}
.dot-badge{top:2px;right:2px}
.demo-pill{border-radius:99px;padding:6px 11px;background:var(--surface);box-shadow:var(--shadow-1);color:var(--fg-3)}
.page{padding-block:6px 48px}

/* Page headers */
.ph{margin-bottom:20px}
.ph h1,.dh h1{font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.03em}
.ph-sub{font-size:13.5px;margin-top:5px}

/* Buttons & inputs */
.btn{height:36px;padding:0 15px;border-radius:11px;border-color:var(--line-2);font-weight:600;box-shadow:none}
.btn:hover{border-color:var(--fg-4);background:var(--surface-2)}
.btn.pri,.btn.acc{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));border-color:transparent;color:#fff;box-shadow:0 6px 16px -6px rgba(21,146,196,.6)}
.btn.pri:hover,.btn.acc:hover{opacity:1;filter:brightness(1.06);background:linear-gradient(135deg,var(--hero-a),var(--hero-b))}
.btn.ghost{box-shadow:none}
.btn.sm{height:30px;padding:0 11px;border-radius:9px}
.btn.xs{height:24px;padding:0 8px;border-radius:7px}
.ib{border-radius:10px}
.inp,.sel,.ta{height:38px;border-radius:11px;border-color:var(--line-2);background-color:var(--surface)}
.sel{background-position:calc(100% - 14px) 16px,calc(100% - 10px) 16px}
.sel.sm,.inp.sm{height:30px;border-radius:9px}
.sel.sm{background-position:calc(100% - 13px) 12px,calc(100% - 9px) 12px}
.ta{height:auto;border-radius:12px;padding:10px 12px}
.inp:focus,.sel:focus,.ta:focus{box-shadow:0 0 0 4px var(--accent-soft)}
.seg{border-radius:12px;padding:3px;background:var(--surface-3);border:0}
.seg button{height:28px;border-radius:9px;padding:0 12px}
.seg button.on{box-shadow:var(--shadow-1)}
.tab{padding:10px 13px;font-weight:600}
.tab.on{color:var(--accent)}
.tab.on::after{height:3px;border-radius:3px 3px 0 0;left:10px;right:10px}
.tab .ct{border-radius:99px}
.fchip{height:32px;border-radius:99px;padding:0 13px;border-color:var(--line-2)}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fchip.on .ct{color:rgba(255,255,255,.8)}
.switch{width:36px;height:20px}
.switch span::after{width:16px;height:16px}
.switch input:checked+span::after{transform:translateX(16px)}

/* Cards */
.card{border:1px solid var(--card-border);border-radius:var(--r-lg);box-shadow:var(--shadow-1)}
.card.plain{box-shadow:none}
.card-h{border-bottom:0;padding:18px 20px 8px;min-height:52px}
.card-h h3{font-size:15.5px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.card-h h3 .ic{color:var(--accent);background:var(--accent-soft);padding:6px;border-radius:9px;box-sizing:content-box}
.card-b{padding:12px 20px 18px}
.grid,.stack{gap:18px}
.section-t{letter-spacing:.08em;color:var(--fg-4);margin:26px 0 12px}

/* KPI tiles: separate cards, the first one is the coloured hero */
.kpis{background:transparent;border:0;border-radius:0;overflow:visible;gap:16px}
.kpi{background:var(--surface);border:1px solid var(--card-border);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:18px 18px 16px;transition:transform .15s var(--ease),box-shadow .15s}
.kpi[data-go]:hover{background:var(--surface);transform:translateY(-2px);box-shadow:var(--shadow-2)}
.kpi-l{font-size:12.5px;font-weight:600;color:var(--fg-3);flex-direction:column;align-items:flex-start;gap:10px}
.kpi-l .ic{width:16px;height:16px;padding:9px;box-sizing:content-box;border-radius:12px;background:var(--accent-soft);color:var(--accent)}
.kpi-v{font-size:26px;font-weight:700;letter-spacing:-.035em;margin-top:6px}
.kpi-d{font-size:12px;margin-top:6px;white-space:normal}
.kpi-d.up,.kpi-d.down,.kpi-d.warn{font-weight:600}
.kpi .spk{top:18px;right:16px;bottom:auto}
.kpis>.kpi:first-child{background:linear-gradient(140deg,var(--hero-a),var(--hero-b));border-color:transparent;color:#fff;box-shadow:0 14px 30px -12px rgba(21,146,196,.7);overflow:hidden;isolation:isolate}
.kpis>.kpi:first-child::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-50px;bottom:-70px;background:rgba(255,255,255,.12);z-index:-1}
.kpis>.kpi:first-child::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:30px;top:-50px;background:rgba(255,255,255,.08);z-index:-1}
.kpis>.kpi:first-child .kpi-l,.kpis>.kpi:first-child .kpi-d{color:rgba(255,255,255,.82)}
.kpis>.kpi:first-child .kpi-l .ic{background:rgba(255,255,255,.2);color:#fff}
.kpis>.kpi:first-child .kpi-d.up,.kpis>.kpi:first-child .kpi-d.down,.kpis>.kpi:first-child .kpi-d.warn{color:#fff}
.kpis>.kpi:first-child .spk svg *{stroke:#fff}
.kpis>.kpi:first-child[data-go]:hover{background:linear-gradient(140deg,var(--hero-a),var(--hero-b))}

/* Badges, avatars */
.b{height:22px;padding:0 9px;border-radius:99px;font-weight:600}
.b.nodot{padding:0 10px}
.tag{border-radius:99px;height:22px;padding:0 9px}
.ai-tag,.ver-tag,.sim-tag{border-radius:99px;padding:2px 9px}
.av{box-shadow:0 0 0 2px var(--surface)}
.co-ic{border-radius:10px;border:0;background:var(--accent-soft);color:var(--accent)}
.co-ic.lg{border-radius:14px}
.src{border-radius:8px;width:26px;height:26px}

/* Progress */
.pg{height:8px;border-radius:99px}
.pg>i{border-radius:99px;background:linear-gradient(90deg,var(--hero-a),var(--hero-b))}
.pg.green>i{background:var(--green)}.pg.amber>i{background:var(--amber)}.pg.red>i{background:var(--red)}.pg.blue>i{background:var(--blue)}

/* Tables */
.tbl{font-size:13px}
.tbl th{background:var(--surface);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-4);padding:10px 16px}
.tbl td{padding:12px 16px}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tfoot td{background:var(--surface-2)}
.toolbar{gap:10px;margin-bottom:16px}
.toolbar .inp-wrap{width:260px}

/* Kanban */
.kb{gap:16px}
.kc{background:var(--surface-2);border:1px solid var(--card-border);border-radius:20px;width:286px}
.kc-h{padding:14px 14px 10px;font-size:13px}
.kc-b{padding:0 10px 10px;gap:10px}
.kcard{border:1px solid var(--card-border);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow-1)}
.kcard:hover{border-color:var(--accent-line)}
.kc-empty{border-radius:14px}

/* Lists, attention items, timeline */
.li{padding:12px 20px}
.attn{border:0;border-radius:14px;background:var(--surface-2);padding:13px 16px}
.attn:hover{background:var(--accent-soft)}
.attn .bar{width:4px;border-radius:4px}
.tl-ic{width:30px;height:30px;border:0;background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 4px var(--surface)}
.tl-i::before{left:15px;top:32px;width:2px;background:var(--surface-3)}
.tl-i:nth-child(4n+2) .tl-ic{background:var(--green-soft);color:var(--green)}
.tl-i:nth-child(4n+3) .tl-ic{background:var(--amber-soft);color:var(--amber)}
.tl-i:nth-child(4n+4) .tl-ic{background:rgba(240,80,140,.12);color:var(--c2)}
.tl-b .body{border:0;border-radius:12px}
.feed-i{padding:11px 20px}

/* Stepper, overlays, menus */
.stepper{border:1px solid var(--card-border);border-radius:16px;box-shadow:var(--shadow-1)}
.step{border-right-color:var(--line)}
.step.cur::after{height:3px}
.modal{border:1px solid var(--card-border);border-radius:22px}
.modal-h{border-bottom:0;padding:20px 22px 8px}
.modal-h h2{font-size:17px;font-weight:700}
.modal-b{padding:14px 22px}
.modal-f{border-top:1px solid var(--line);border-radius:0 0 22px 22px;padding:14px 22px}
.drawer{border-left:0;border-radius:22px 0 0 22px}
.pop{border:1px solid var(--card-border);border-radius:16px}
.menu{padding:6px}
.menu button{border-radius:10px;padding:8px 10px}
.callout{border-radius:14px}

/* Responsive */
@media (max-width:1100px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))!important} }
@media (max-width:860px){
  .app{padding:0}
  .sb{border-radius:0 22px 22px 0;border:0}
  .top{height:58px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .search-btn{min-width:0;box-shadow:none}
  .top .ib{width:36px;height:36px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px}
  .kpi-v{font-size:22px}
  .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{padding:0 10px}
  .page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* ---------- Team calendar ---------- */
.callout.green{background:var(--green-soft);border-color:transparent;color:var(--fg)}
.callout.green .ic{color:var(--green)}
.k-discovery{--kc:var(--accent);--kbg:var(--accent-soft)}
.k-meeting{--kc:var(--blue);--kbg:var(--blue-soft)}
.k-site{--kc:var(--green);--kbg:var(--green-soft)}
.k-blocked{--kc:var(--slate);--kbg:var(--slate-soft)}
.k-leave{--kc:var(--amber);--kbg:var(--amber-soft)}
.cal-tb .cal-label{font-size:15px;margin-left:8px;white-space:nowrap}
.cal-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--fg-2);margin:-4px 0 14px}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;background:var(--kc)}
.cal-wk{overflow-x:auto}
.cal-head,.cal-adrow,.cal-body{display:grid;grid-template-columns:58px repeat(7,minmax(100px,1fr));min-width:780px}
.cal-head{border-bottom:1px solid var(--line)}
.cal-dh{padding:12px 6px 10px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:12px}
.cal-dh:hover{background:var(--surface-2)}
.cal-dh span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3);font-weight:600}
.cal-dh b{font-size:18px;font-weight:700;width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.cal-dh.today b{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;box-shadow:0 6px 14px -6px rgba(21,146,196,.7)}
.cal-adrow{border-bottom:1px solid var(--line);min-height:34px}
.cal-adrow .cal-h{display:flex;align-items:center;justify-content:flex-end;padding-right:8px}
.cal-ad{padding:4px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-ad .cal-ev{position:static}
.cal-body{max-height:calc(100vh - 330px);min-height:360px;overflow-y:auto}
.cal-hours .cal-h{font-size:11px;color:var(--fg-4);text-align:right;padding-right:8px;font-variant-numeric:tabular-nums}
.cal-hours .cal-h:first-child{visibility:hidden}
.cal-col{position:relative;border-left:1px solid var(--line)}
.cal-col.today{background:linear-gradient(var(--accent-soft),var(--accent-soft));background-color:transparent}
.cal-col.today .cal-slot.off{background:transparent}
.cal-slot{height:23px;border-top:1px solid var(--line);cursor:pointer;transition:background .1s}
.cal-slot.half{border-top:1px dashed var(--surface-3)}
.cal-slot.off{background:var(--surface-2)}
.cal-slot:hover{background:var(--accent-soft)!important}
.cal-ev{position:absolute;border-radius:10px;background:var(--kbg);border-left:3px solid var(--kc);padding:4px 7px;font-size:11.5px;line-height:1.3;overflow:hidden;cursor:pointer;color:var(--fg);z-index:1;transition:box-shadow .15s,transform .15s}
.cal-ev:hover{z-index:3;box-shadow:var(--shadow-2);transform:translateY(-1px)}
.cal-ev .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-ev .tm{color:var(--kc);margin-right:5px;font-variant-numeric:tabular-nums}
.cal-ev .s{color:var(--fg-3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-ev .p{display:flex;margin-top:3px}
.cal-ev .p .av+.av{margin-left:-5px}
.cal-ev.done{opacity:.5}
.cal-now{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:2;pointer-events:none}
.cal-now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.cal-mo{overflow-x:auto}
.cal-mo-h,.cal-mo-g{display:grid;grid-template-columns:repeat(7,minmax(90px,1fr));min-width:640px}
.cal-mo-h div{padding:12px 10px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3);font-weight:600}
.cal-mc{min-height:108px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:6px 7px;cursor:pointer;min-width:0;transition:background .1s}
.cal-mc:nth-child(7n+1){border-left:0}
.cal-mc:hover{background:var(--surface-2)}
.cal-mc.other{opacity:.45}
.cal-mc .n{font-size:12.5px;font-weight:700;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;margin-bottom:2px}
.cal-mc.today .n{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff}
.cal-pill{font-size:11px;border-radius:7px;padding:2px 6px;background:var(--kbg);border-left:3px solid var(--kc);color:var(--fg);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cal-ag-t{width:96px;flex:none;font-size:12px;color:var(--fg-2);font-weight:600}
.bk-people{display:flex;flex-wrap:wrap;gap:8px}
.bk-pp{border:1px solid var(--line-2);border-radius:99px;padding:4px 11px 4px 6px;gap:7px;transition:background .12s,border-color .12s}
.bk-pp:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.cal-today{display:flex;align-items:center;gap:16px;padding:14px 18px;margin-bottom:18px}
.cal-today-ic{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;display:grid;place-items:center;flex:none}
.cal-today-l{flex:1;display:flex;gap:8px;overflow-x:auto;min-width:0;scrollbar-width:none}
.cal-today-l::-webkit-scrollbar{display:none}
.cal-tchip{flex:none;display:inline-flex;align-items:center;gap:8px;border:0;background:var(--kbg);border-left:3px solid var(--kc);border-radius:10px;padding:7px 10px;font:inherit;font-size:12.5px;font-weight:600;color:var(--fg);cursor:pointer}
.cal-tchip .num{color:var(--kc)}
.cal-tchip .av{box-shadow:0 0 0 2px var(--kbg)}
@media (max-width:860px){
  .cal-today{flex-wrap:wrap}
  .cal-today-l{order:3;flex-basis:100%}
  .cal-tb .cal-label{font-size:13.5px}
}

/* ---------- Lead Acquisition ---------- */
.la-filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.la-filters .la-search{width:240px}
.la-filters .sel.sm{max-width:180px}
.la-bulk{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 20px;background:var(--accent-soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.la-tbl td{vertical-align:top}
.la-tbl tr.la-dim td{opacity:.62}
.la-tbl tr.la-dim:hover td{opacity:1}
.la-pager{padding:12px 20px;border-top:1px solid var(--line)}
.la-score{display:inline-grid;place-items:center;min-width:38px;height:26px;padding:0 8px;border-radius:99px;font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px}
.la-score.green{background:var(--green-soft);color:var(--green)}.la-score.cyan{background:var(--accent-soft);color:var(--accent)}.la-score.amber{background:var(--amber-soft);color:var(--amber)}.la-score.gray{background:var(--slate-soft);color:var(--fg-3)}
.la-big{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:26px;font-weight:800;letter-spacing:-.03em;flex:none}
.la-big.green{background:var(--green-soft);color:var(--green)}.la-big.cyan{background:var(--accent-soft);color:var(--accent)}.la-big.amber{background:var(--amber-soft);color:var(--amber)}.la-big.gray{background:var(--slate-soft);color:var(--fg-3)}
.la-bar{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:12.5px}
.la-contact{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface-2)}
.la-contact.blocked{opacity:.6;background:var(--red-soft)}
.la-cd{display:flex;flex-direction:column;gap:5px;margin-top:8px;font-size:12.5px}
.la-cd>div{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.la-checks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.la-checks li{display:flex;gap:7px;align-items:center;font-size:12.75px}
.la-checks li.ok .ic{color:var(--green)}.la-checks li.no{color:var(--fg-3)}.la-checks li.no .ic{color:var(--fg-4)}
.la-svc{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:12.75px}
.la-svc span{color:var(--fg-2);line-height:1.45}
.la-ev{display:flex;gap:9px;align-items:flex-start}
.la-pre{white-space:pre-wrap;font-family:var(--font);font-size:13px;line-height:1.6;background:var(--surface-2);border-radius:12px;padding:14px 16px;margin:0;max-height:52vh;overflow:auto}
.la-pills{display:flex;flex-wrap:wrap;gap:6px}
.la-pill{border:1px solid var(--line-2);border-radius:99px;padding:4px 11px 4px 8px;font-size:12.5px}
.la-pill:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent-2)}
.la-step{display:flex;gap:10px;align-items:flex-start;color:var(--fg-3)}
.la-step.ok{color:var(--fg)}.la-step.ok .ic{color:var(--green)}
.la-how{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;line-height:1.5;font-size:13px}
@media (max-width:860px){ .la-checks{grid-template-columns:1fr} .la-bar{grid-template-columns:110px minmax(0,1fr) 40px} .la-filters .la-search{width:100%} .la-filters .sel.sm{max-width:none;flex:1 1 140px} }

/* =====================================================================
   BEMO-SOLUTIONS BRAND (matches www.bemosolutions.co.za):
   navy #0B1220, cyan #20C7D9 -> deep teal #1592C4/#0A6E86, Urbanist + Fraunces
   ===================================================================== */
:root{
  --font: "Urbanist", "Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-display: "Fraunces", Georgia, serif;
  --bg:#F2F5F8; --bg-2:#E9EEF3; --surface:#FFFFFF; --surface-2:#F6F8FB; --surface-3:#EDF2F6;
  --line:#E3E8EE; --line-2:#D2DAE3;
  --fg:#0B1220; --fg-2:#3E4B60; --fg-3:#65758B; --fg-4:#A3AFBF;
  --accent:#0A7F8E; --accent-2:#086C79; --accent-fg:#FFFFFF; --accent-soft:#E2F7F9; --accent-line:#A6E3EA;
  --blue:#4D83F5; --blue-soft:#E8F0FE;
  --c1:#0A9DB0; --c2:#4D83F5; --c3:#14A06A; --c4:#E2A13A; --c5:#C3CCD8; --c6:#172438;
  --ink:#0B1220; --hero-a:#1592C4; --hero-b:#0A6E86; --dark-card:#0B1220;
  --slate:#65758B;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#060A12; --bg-2:#0A1019; --surface:#0E1522; --surface-2:#131C2C; --surface-3:#192436;
  --line:#1E2A3E; --line-2:#2A3850;
  --fg:#EAF0F6; --fg-2:#A9B6C7; --fg-3:#7A889B; --fg-4:#4A5770;
  --accent:#20C7D9; --accent-2:#4BD3E2; --accent-fg:#04121A; --accent-soft:rgba(32,199,217,.13); --accent-line:rgba(32,199,217,.4);
  --blue:#7FA6FA; --blue-soft:rgba(127,166,250,.14);
  --c1:#20C7D9; --c2:#7FA6FA; --c3:#3ED598; --c4:#F5B83D; --c5:#33415A; --c6:#9FB0C8;
  --ink:#EAF0F6; --hero-a:#1592C4; --hero-b:#0A6E86; --dark-card:#0B1220;
}}
:root[data-theme="dark"]{
  --bg:#060A12; --bg-2:#0A1019; --surface:#0E1522; --surface-2:#131C2C; --surface-3:#192436;
  --line:#1E2A3E; --line-2:#2A3850;
  --fg:#EAF0F6; --fg-2:#A9B6C7; --fg-3:#7A889B; --fg-4:#4A5770;
  --accent:#20C7D9; --accent-2:#4BD3E2; --accent-fg:#04121A; --accent-soft:rgba(32,199,217,.13); --accent-line:rgba(32,199,217,.4);
  --blue:#7FA6FA; --blue-soft:rgba(127,166,250,.14);
  --c1:#20C7D9; --c2:#7FA6FA; --c3:#3ED598; --c4:#F5B83D; --c5:#33415A; --c6:#9FB0C8;
  --ink:#EAF0F6; --hero-a:#1592C4; --hero-b:#0A6E86; --dark-card:#0B1220;
}
body{font-weight:500;letter-spacing:0}
.ph h1,.dh h1,.cal-today b,.la-big,.kpi-v{font-family:var(--font-display);font-variation-settings:"SOFT" 100,"WONK" 0;letter-spacing:-.01em}
.ph h1,.dh h1{font-weight:600}
.kpi-v{font-weight:600}
.logo{background:none!important;width:34px;height:34px;border-radius:10px;padding:0;overflow:hidden}
.logo svg{width:100%;height:100%;display:block}
.sb-ws-t b{font-weight:800;letter-spacing:.01em}
.sb-ws-t span{color:var(--accent)}
.sb-foot{background:linear-gradient(135deg,#0B1220,#172438)}
:root[data-theme="dark"] .sb-foot{border:1px solid var(--line)}
.sb-foot::after{background:radial-gradient(circle,rgba(32,199,217,.45),transparent 70%)}
.fchip.on,.fchip.on .ct{color:var(--accent-fg)}

/* ---------- Sales performance ---------- */
.pf-funnel{display:flex;flex-direction:column;gap:10px}
.pf-step{display:grid;grid-template-columns:170px minmax(0,1fr) 56px;gap:12px;align-items:center}
.pf-lbl{display:flex;flex-direction:column;line-height:1.25}
.pf-bar{position:relative;height:30px;background:var(--surface-2);border-radius:10px;overflow:hidden;display:flex;align-items:center}
.pf-bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--hero-a),var(--hero-b));border-radius:10px}
.pf-bar span{position:relative;margin-left:10px;font-weight:700;color:var(--fg);mix-blend-mode:normal}
.pf-bar i+span{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.pf-conv{text-align:right}
.pf-big{font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1.15}
.pf-tgs{display:grid;grid-template-columns:62px minmax(0,1fr);gap:4px 8px;align-items:center}
.pf-tg{display:flex;align-items:center;gap:8px}
.pf-tg .pg{min-width:60px}
@media (max-width:860px){ .pf-step{grid-template-columns:110px minmax(0,1fr) 48px} }

/* ---------- BEMO-SOLUTIONS documents (quotes & invoices, screen + print) ---------- */
.doc.bdoc{padding:0;overflow:hidden;border-radius:14px;font-family:"Urbanist","Segoe UI",Arial,sans-serif;color:#1A2233;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bdoc .bd-head{background:#0B1220;background-image:radial-gradient(circle at 92% 0%,rgba(32,199,217,.3) 0,rgba(32,199,217,0) 46%);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:26px 36px}
.bdoc .bd-brand{display:flex;align-items:center;gap:14px}
.bdoc .bd-brand svg{flex:none;border-radius:11px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.bdoc .bd-name{font-weight:800;font-size:17px;letter-spacing:.02em}
.bdoc .bd-tag{font-size:11.5px;color:#9AA3B8;margin-top:2px}
.bdoc .bd-title{text-align:right}
.bdoc .bd-kind{font-family:"Fraunces",Georgia,serif;font-size:26px;font-weight:700;line-height:1.1}
.bdoc .bd-id{color:#20C7D9;font-weight:700;font-size:12.5px;letter-spacing:.06em;margin-top:4px}
.bdoc .bd-stamp{display:inline-block;margin-top:8px;border:1.5px solid #20C7D9;color:#20C7D9;font-weight:800;letter-spacing:.12em;font-size:10.5px;padding:3px 9px;border-radius:5px;text-transform:uppercase}
.bdoc .bd-bar{height:4px;background:linear-gradient(90deg,#20C7D9,#0A7F8E)}
.bdoc .bd-parties{display:grid;grid-template-columns:1fr 1fr auto;gap:22px;padding:24px 36px 6px;font-size:12.5px}
.bdoc .bd-lbl{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#0A7F8E;margin-bottom:4px}
.bdoc .bd-muted{color:#5E6782;line-height:1.5}
.bdoc .bd-meta{text-align:right;font-size:12.5px}
.bdoc .bd-meta span{color:#5E6782;margin-right:8px}
.bdoc .bd-h{font-family:"Fraunces",Georgia,serif;font-size:18px;margin:18px 36px 4px;color:#0B1220}
.bdoc .bd-h+p{margin:0 36px}
.bdoc .bd-scope{margin:12px 36px 0;font-size:12.5px}
.bdoc .bd-scope ul{margin:4px 0 0;padding-left:18px}
.bdoc .bd-tbl{width:calc(100% - 72px);margin:16px 36px 0;border-collapse:collapse;font-size:12.5px}
.bdoc .bd-tbl th{text-align:left;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#5E6782;padding:8px 6px;border-bottom:2px solid #0B1220}
.bdoc .bd-tbl td{padding:10px 6px;border-bottom:1px solid #E6E9F2;vertical-align:top}
.bdoc .bd-tbl .r{text-align:right;white-space:nowrap}
.bdoc .bd-tot{margin:12px 36px 0 auto;width:280px;font-size:12.5px}
.bdoc .bd-tot div{display:flex;justify-content:space-between;padding:4px 6px}
.bdoc .bd-tot .gt{background:#0B1220;color:#fff;border-radius:8px;font-weight:800;font-size:14px;padding:9px 10px;margin:6px 0 2px}
.bdoc .bd-note{margin:22px 36px 0;font-size:11.5px;color:#5E6782;line-height:1.55}
.bdoc .bd-note b{color:#0B1220}
.bdoc .bd-bank{margin:14px 36px 0;background:#E2F7F9;border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.55}
.bdoc .bd-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:26px;padding:16px 36px;background:#F6F8FC;border-top:1px solid #E6E9F2;font-size:11px;color:#5E6782}
.bdoc .bd-foot>div:first-child{display:flex;align-items:center;gap:8px;color:#0B1220}
.bdoc .bd-foot svg{border-radius:5px}
@media (max-width:700px){ .bdoc .bd-parties{grid-template-columns:1fr} .bdoc .bd-meta{text-align:left} .bdoc .bd-head{flex-direction:column;align-items:flex-start} .bdoc .bd-title{text-align:left} .bdoc .bd-tot{width:auto;margin-left:36px} }
</style>
