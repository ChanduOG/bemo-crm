# Keeps the free Supabase project from being paused (it pauses after 7 days
# without activity). Runs every day. Needs two repository secrets:
#   SUPABASE_URL       e.g. https://abcdefgh.supabase.co
#   SUPABASE_ANON_KEY  the anon / publishable key (NOT the service_role key)
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 4 * * *'     # every day at 04:17 UTC (06:17 South African time)
    - cron: '47 16 * * 3'    # plus a Wednesday afternoon backup ping
  workflow_dispatch:          # lets you press "Run workflow" to test it

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Add the SUPABASE_URL and SUPABASE_ANON_KEY secrets first (Settings > Secrets and variables > Actions)."; exit 1
          fi
          URL="${SUPABASE_URL%/}/rest/v1/rpc/keepalive"
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o reply.txt -w "%{http_code}" -X POST "$URL" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" \
              -d '{"p_source":"github"}')
            echo "Attempt $attempt: HTTP $code - $(cat reply.txt)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 60
          done
          echo "Supabase did not answer. If the project is paused, open supabase.com/dashboard and press Restore."
          exit 1
